[project]
name = "based-models-agentloop-tools"
version = "0.1.1"
description = "Tools for agentloop agents: native web search now; client search and coding tools next."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "agent", "tools", "web-search", "agentloop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # NAMED, not a git URL: this library uses agentloop's public API only
    # (tests/test_layering.py), so it depends on it like any other consumer would.
    # The importable package is `agentloop`; the distribution is
    # `based-models-agentloop` (the bare name on PyPI is an unrelated project).
    "based-models-agentloop>=0.4.0,<0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.urls]
Repository = "https://github.com/based-models/agent-loop-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentloop_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/agentloop_tools", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
